<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tripzy - Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f8f5ff;
}

nav{
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:#7c3aed;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav ul li a{
    text-decoration:none;
    color:#333;
}

.active{
    color:#7c3aed;
}

.profile{
    max-width:900px;
    margin:50px auto;
    background:white;
    border-radius:20px;
    padding:40px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.top{
    text-align:center;
}

.profile-img{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #7c3aed;
}

h1{
    margin-top:15px;
}

.email{
    color:#666;
    margin-top:5px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:40px;
}

.card{
    background:#f8f5ff;
    padding:25px;
    border-radius:15px;
    text-align:center;
}

.card h2{
    color:#7c3aed;
}

.details{
    margin-top:40px;
}

.details p{
    margin:15px 0;
    font-size:18px;
}

button{
    margin-top:25px;
    background:linear-gradient(to right,#7c3aed,#ec4899);
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    cursor:pointer;
}

</style>
</head>

<body>

<nav>
    <div class="logo">Tripzy</div>

    <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="destinations.html">Destinations</a></li>
        <li><a href="mytrip.html">Trip Planner</a></li>
        <li><a href="#" class="active">Profile</a></li>
    </ul>
</nav>

<div class="profile">

    <div class="top">

        <img src="https://i.pinimg.com/736x/e0/8f/79/e08f793f6b07c447a43db0a7d3e31ac3.jpg" class="profile-img">

        <h1>Aarzoo Nagpal</h1>

        <p class="email">aarzoonagpal1804@gmail.com</p>

        <button>Edit Profile</button>

    </div>

    <div class="stats">

        <div class="card">
            <h2>12</h2>
            <p>Trips Completed</p>
        </div>

        <div class="card">
            <h2>5</h2>
            <p>Wishlist Places</p>
        </div>

        <div class="card">
            <h2>3</h2>
            <p>Upcoming Trips</p>
        </div>

    </div>

    <div class="details">

        <p><strong>📞 Phone:</strong> +91 98763-44556</p>

        <p><strong>📍 Location:</strong> Chandigarh, India</p>

        <p><strong>✈ Favorite Destination:</strong> Goa</p>

        <p><strong>📅 Member Since:</strong> January 2026</p>

    </div>

</div>

</body>
</html>
